name: GPMB3 Dashboard Check

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gpmb3-dashboard.yml'
      - 'workflow-trigger.txt'
      - 'index.html'

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch and verify dashboard
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('So với trước chiến dịch', 'So trước chiến dịch').replace('So trước CĐ', 'So trước chiến dịch')
          pairs = [
              ('578,25 ha + 29,62 km', '578,25 ha + 25,55 km'),
              ('29,62 km + 578,25 ha', '578,25 ha + 25,55 km'),
              ('381,77 ha + 28,18 km', '381,77 ha + 20,89 km'),
              ('28,18 km + 381,77 ha', '381,77 ha + 20,89 km'),
              ('77,21 ha + 1,00 km', '79,10 ha + 0,99 km'),
              ('1,00 km + 77,21 ha', '79,10 ha + 0,99 km'),
              ('79,57 ha + 0,99 km', '79,10 ha + 0,99 km'),
              ('79,10 ha + 1,00 km', '79,10 ha + 0,99 km'),
          ]
          for old, new in pairs:
              text = text.replace(old, new)
          text = re.sub(r'"xã Tuy An Đông": \{ text: "tăng [^"]+", color: colors\.weekUp \}', '"xã Tuy An Đông": { text: "tăng 4% (0,6 km)", color: colors.weekUp }', text)
          text = re.sub(r'"phường Phú Yên": \{ text: "tăng [^"]+", color: colors\.weekUp \}', '"phường Phú Yên": { text: "tăng 22,09% (8,48 ha)", color: colors.weekUp }', text)
          text = re.sub(r'"xã Hòa Xuân": \{ text: "tăng [^"]+", color: colors\.weekUp \}', '"xã Hòa Xuân": { text: "tăng 26,55% (69,8255 ha)", color: colors.weekUp }', text)
          func_lines = [
              'function weightedLocalityProgress(rows) {',
              '      const usable = rows.filter(row => row.progress > 0);',
              '      const basis = usable.length ? usable : rows;',
              '      if (!basis.length) return 0;',
              '      return basis.reduce((sum, row) => sum + row.progress, 0) / basis.length;',
              '    }',
              '',
              '    function normalizeLocalityName',
          ]
          text, n = re.subn(r'function weightedLocalityProgress\(rows\) \{[\s\S]*?\n    \}\n\n    function normalizeLocalityName', '\n'.join(func_lines), text, count=1)
          if n != 1:
              raise SystemExit('weightedLocalityProgress not patched')
          required = [
              '578,25 ha + 25,55 km',
              '381,77 ha + 20,89 km',
              '79,10 ha + 0,99 km',
              '"phường Phú Yên": { text: "tăng 22,09% (8,48 ha)", color: colors.weekUp }',
              '"xã Tuy An Đông": { text: "tăng 4% (0,6 km)", color: colors.weekUp }',
              '"xã Hòa Xuân": { text: "tăng 26,55% (69,8255 ha)", color: colors.weekUp }',
              '90.06168609',
              '93.90500210',
              '60.77327343',
              'const showWeeklyDelta = false;',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('missing required data: ' + repr(missing))
          if 'So với trước chiến dịch' in text or 'So trước CĐ' in text or 'areaRows.length === basis.length' in text:
              raise SystemExit('old calculation or label still present')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit dashboard
        run: |
          if git diff --quiet -- index.html; then
            echo 'Dashboard already reconciled.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Reconcile public dashboard numbers'
            git push
          fi

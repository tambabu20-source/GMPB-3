name: GPMB3 Dashboard Check

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gpmb3-dashboard.yml'
      - 'workflow-trigger.txt'
      - 'index.html'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check dashboard file
        run: |
          test -f index.html
          grep -q 'Dashboard' index.html
          echo 'Dashboard file is present.'

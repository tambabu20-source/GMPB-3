name: Cập nhật dashboard GPMB Tổ công tác số 3 hằng ngày

on:
  schedule:
    # 16:00 hằng ngày theo giờ Việt Nam (UTC+7) = 09:00 UTC.
    - cron: "0 9 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/daily-gpmb3-update.yml"
      - "workflow-trigger.txt"
      - "update_dashboard_from_drive.py"
      - "patch_*.py"

concurrency:
  group: gpmb3-dashboard-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Chuẩn hóa bộ đọc dữ liệu dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("update_dashboard_from_drive.py")
          text = path.read_text(encoding="utf-8")
          if "def locate_projects_block(html: str)" not in text:
              lines = [
                  'def locate_projects_block(html: str) -> tuple[int, int, str]:',
                  '    """Find the JS projects array without depending on nearby constants."""',
                  '    marker = "const projects ="',
                  '    marker_start = html.find(marker)',
                  '    if marker_start < 0:',
                  '        raise SystemExit("Không tìm thấy mảng projects trong index.html")',
                  '    array_start = html.find("[", marker_start)',
                  '    if array_start < 0:',
                  '        raise SystemExit("Không tìm thấy điểm bắt đầu mảng projects trong index.html")',
                  '',
                  '    depth = 0',
                  '    quote = None',
                  '    escaped = False',
                  '    for pos in range(array_start, len(html)):',
                  '        char = html[pos]',
                  '        if quote:',
                  '            if escaped:',
                  '                escaped = False',
                  '            elif char == chr(92):',
                  '                escaped = True',
                  '            elif char == quote:',
                  '                quote = None',
                  '            continue',
                  '        if char in (\'"\', "\'"):',
                  '            quote = char',
                  '        elif char == "[":',
                  '            depth += 1',
                  '        elif char == "]":',
                  '            depth -= 1',
                  '            if depth == 0:',
                  '                array_end = pos + 1',
                  '                semicolon = html.find(";", array_end)',
                  '                if semicolon < 0:',
                  '                    raise SystemExit("Không tìm thấy điểm kết thúc mảng projects trong index.html")',
                  '                return marker_start, semicolon + 1, html[array_start:array_end]',
                  '    raise SystemExit("Không đọc hết được mảng projects trong index.html")',
                  '',
                  '',
                  'def extract_projects(html: str) -> list[dict]:',
                  '    _, _, payload = locate_projects_block(html)',
                  '    return json.loads(payload)',
                  '',
                  '',
                  'def replace_projects(html: str, projects: list[dict], data_date: str) -> str:',
                  '    payload = json.dumps(projects, ensure_ascii=False, indent=6)',
                  '    start, end, _ = locate_projects_block(html)',
                  r'    indent_match = re.search(r"(^[ \t]*)const projects =", html[: start + 30], re.M)',
                  '    indent = indent_match.group(1) if indent_match else "    "',
                  r'    projects_block = indent + "const projects = " + ("\n" + indent).join(payload.splitlines()) + ";"',
                  '    html = html[:start] + projects_block + html[end:]',
                  r'    html = re.sub(r\'const dataUpdatedDate = "[^\"]+";\', f\'const dataUpdatedDate = "{data_date}";\', html)',
                  '    return html',
              ]
              replacement = "\n".join(lines) + "\n\n"
              text, count = re.subn(
                  r"def extract_projects\(html: str\) -> list\[dict\]:\n.*?(?=\ndef block_for\(lines: list\[str\])",
                  replacement,
                  text,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit("Không tìm được vị trí thay bộ đọc mảng projects.")
              path.write_text(text, encoding="utf-8")
              print("Đã chuẩn hóa bộ đọc mảng projects.")
          else:
              print("Bộ đọc mảng projects đã ổn.")
          PY
          python -m py_compile update_dashboard_from_drive.py

      - name: Lưu số liệu đang công khai để đối chiếu
        run: cp index.html index-before-update.html

      - name: Cập nhật dashboard từ Google Drive
        run: python update_dashboard_from_drive.py --index index.html

      - name: Rà soát và chuẩn hóa dashboard
        run: |
          python patch_progress_safety.py --index index.html
          python patch_progress_regression_guard.py --index index.html --baseline index-before-update.html
          python patch_ct02_chart.py --index index.html
          python patch_locality_chart.py --index index.html
          python patch_locality_ratio_calc.py --index index.html
          python patch_locality_mobile_css.py --index index.html
          python patch_locality_percent_style.py --index index.html
          python patch_chart_zero_and_locality_average.py --index index.html
          python patch_project1_units.py --index index.html
          python patch_chart_readability.py --index index.html
          python patch_summary_context.py --index index.html
          python patch_20260808_report.py --index index.html
          python patch_tb378_current_day.py --index index.html
          python patch_current_timeline.py --index index.html
          python patch_mobile_chart_scaling.py --index index.html
          python patch_compact_desktop_charts.py --index index.html
          python patch_source_link.py --index index.html
          python patch_progress_regression_guard.py --index index.html --baseline index-before-update.html
          python patch_hide_weekly_delta.py --index index.html
          python patch_campaign_delta_charts.py --index index.html
          python patch_campaign_delta_labels.py --index index.html
          python patch_summary_area_metrics.py --index index.html
          python patch_final_source_dates.py --index index.html
          python patch_tb378_current_day.py --index index.html
          python patch_final_chart_guard.py --index index.html

      - name: Khóa cách tính biểu đồ xã phường
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          replacement = '''    function weightedLocalityProgress(rows) {
                const usable = rows.filter(row => row.progress > 0);
                const basis = usable.length ? usable : rows;
                if (!basis.length) return 0;
                return basis.reduce((sum, row) => sum + row.progress, 0) / basis.length;
              }
          '''
          text, count = re.subn(
              r"    function weightedLocalityProgress\(rows\) \{\n.*?\n    \}\n\n    function normalizeLocalityName",
              replacement + "\n    function normalizeLocalityName",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("Không tìm thấy hàm weightedLocalityProgress để khóa cách tính xã/phường")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit nếu có số liệu mới
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Không có thay đổi số liệu."
          else
            git commit -m "Tự động cập nhật dashboard GPMB Tổ công tác số 3"
            git push
          fi
